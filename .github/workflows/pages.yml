name: Publish to gh-pages
on:
  push:
    branches: [main]
    paths-ignore:
      - 'data/**'        # 게시 버튼이 data/ 를 main·gh-pages 에 직접 커밋하므로 데이터 변경은 재배포 불필요
      - 'README.md'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gh-pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare site
        run: |
          mkdir -p _site
          rsync -a --exclude .git --exclude .github --exclude _site --exclude README.md ./ _site/
          touch _site/.nojekyll
          echo "{\"v\":\"${GITHUB_SHA::7}\"}" > _site/version.json
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          force_orphan: true
